site_name: agentgauge
site_description: Regression testing for LLM agents. Did this change make my agent better or worse, and is that difference real?
site_url: https://alinaveed01.github.io/agentgauge/
repo_url: https://github.com/AliNaveed01/agentgauge
repo_name: AliNaveed01/agentgauge
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Getting started:
      - Quickstart: quickstart.md
      - Writing a suite: suites.md
